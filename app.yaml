runtime: nodejs20

instance_class: F2  # Ajusta según tus necesidades

env_variables:
  NODE_ENV: 'production'

automatic_scaling:
  target_cpu_utilization: 0.65
  max_instances: 3

handlers:
  - url: /WebUntis
    script: auto

  - url: /(.*)
    static_files: dist/umedcal/browser/\1
    upload: dist/umedcal/(.*)
    secure: always
    redirect_http_response_code: 301

  - url: /
    static_files: dist/umedcal/browser/index.html
    upload: dist/umedcal/browser/index.html
    secure: always
    redirect_http_response_code: 301
