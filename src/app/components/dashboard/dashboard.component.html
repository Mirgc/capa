<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="application/ld+json">
{
  "@context": "http://schema.org",
  "@type": "Course",
  "name": "Horarios de Medicina",
  "provider": {
    "@type": "EducationalOrganization",
    "name": "Horario de Medicina de la UPV/EHU"
  }
}
</script>
<div class="container-fluid my-4">
  <div class="row">
    <!-- Filters -->
    <div [ngClass]="isCollapsed ? 'col-sm-auto' : 'col-sm-3'" class="mb-4">
      <!-- Collapse Container for Filters -->
      <div class="card shadow-sm">
        <div class="card-body">
          <!-- Toggle Button for Collapsing Filters -->
          <button class="btn btn-outline-secondary" (click)="isCollapsed = !isCollapsed">
            <i class="bi bi-list" style="width: 24px; height: 24px;"></i>
          </button>
          <div [ngbCollapse]="isCollapsed" class="collapse-horizontal p-1">
            <header>
              <h1>Horarios de Medicina</h1>
              <h2>Consulta y organiza tus clases</h2>
            </header>
            <!-- Medicina Selection -->
            <div class="mb-1">
              <div class="form-check">
                <input class="form-check-input" type="radio" id="grupo1" [checked]="selectedGroup.includes('grupo1')" (change)="onGroupSelectionChange($event, 'grupo1')">
                <label class="form-check-label" for="grupo1">Grupo 1</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" id="grupo2" [checked]="selectedGroup.includes('grupo2')" (change)="onGroupSelectionChange($event, 'grupo2')">
                <label class="form-check-label" for="grupo2">Grupo 2</label>
              </div>
            </div>
            <div class="mb-1">
              <label for="medicinaSelect" class="form-label">Curso:</label>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="medicina1" [checked]="selectedMedicina.includes('medicina1')" (change)="onMedicinaSelectionChange($event, 'medicina1')">
                <label class="form-check-label" for="medicina1">Medicina 1</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="medicina2" [checked]="selectedMedicina.includes('medicina2')" (change)="onMedicinaSelectionChange($event, 'medicina2')">
                <label class="form-check-label" for="medicina2">Medicina 2</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="medicina3" [checked]="selectedMedicina.includes('medicina3')" (change)="onMedicinaSelectionChange($event, 'medicina3')">
                <label class="form-check-label" for="medicina3">Medicina 3</label>
              </div>
            </div>
            <br>
            <!-- LongName Filter -->
            <div class="mb-1">
              <label for="longNameFilter" class="form-label">Filtrar por asignaturas:</label>
                <ng-container *ngFor="let data of combinedScheduleData">
                    <ng-container *ngFor="let lesson of data.data.result.data.elements">
                        <ng-container *ngIf="lesson.type === 3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="lesson{{lesson.id}}" (change)="onLessonSelectionChange($event, lesson.id)" [checked]="selectedLessons.has(lesson.id)">
                                <label class="form-check-label" for="lesson{{lesson.id}}">{{ lesson.longName }}</label>
                            </div>
                        </ng-container>
                    </ng-container>
                </ng-container>
            </div>
            <div class="mb-3">
                <button class="btn btn-primary" (click)="applyLessonFilter()">Refrescar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Week Selection and Calendar -->
    <div class="col-sm">
      <div class="card shadow-sm mb-3">
        <div class="card-body d-flex align-items-center justify-content-between">
          <button class="btn btn-outline-secondary" (click)="previousWeek()">
            <i class="bi bi-chevron-left" style="width: 24px; height: 24px;"></i>
          </button>
          <button class="btn btn-outline-secondary" (click)="d.toggle()" type="button">
            <i class="bi bi-calendar" style="width: 24px; height: 24px;"></i>
          </button>
          <input class="form-control" [placeholder]="formatDateToShow(currentWeekStart)" name="dp" [value]="formatDateToShow(currentWeekStart)" [(ngModel)]="model" ngbDatepicker #d="ngbDatepicker" (ngModelChange)="onInputChange(model)" />
          <button class="btn btn-outline-secondary" (click)="nextWeek()">
            <i class="bi bi-chevron-right" style="width: 24px; height: 24px;"></i>
          </button>
        </div>
      </div>

      <hr />
      <!-- Schedule Component -->
      <ng-container *ngIf="loading; else scheduleTemplate">
        <div class="alert alert-info" role="alert">
          Cargando horarios, por favor espera...
        </div>
      </ng-container>

      <ng-template #scheduleTemplate>
        <ng-container *ngIf="combinedScheduleData && combinedScheduleData.length > 0; else noDataTemplate">
          <app-schedule [scheduleData]="combinedScheduleData"></app-schedule>
        </ng-container>
      </ng-template>

      <ng-template #noDataTemplate>
        <div class="alert alert-warning" role="alert">
          La web de Webuntis no funciona correctamente, disculpen las molestias.
        </div>
      </ng-template>
    </div>
  </div>
</div>
